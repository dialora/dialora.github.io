<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кассовый чек</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="toolbar">
      <button type="button" id="printButton">Печать</button>
      
      <!-- Новая кнопка для переключения вида -->
      <button type="button" id="toggleViewButton">Вид: JSON</button>
      
      <div class="menu" id="jsonMenu">
        <button type="button" data-file="1.json">Чек 1</button>
        <button type="button" data-file="2.json">Чек 2</button>
        <button type="button" data-file="3.json">Чек 3</button>
        <button type="button" data-file="4.json">Чек 4</button>
        <button type="button" data-file="5.json">Чек 5</button>
      </div>

      <span class="status" id="status">Выберите чек для загрузки</span>
    </div>

    <main class="page-wrap">
      <!-- Контейнер с визуальным чеком -->
      <article class="paper" id="paper">
        <header>
          <div>
            <h1>Кассовый чек</h1>
          </div>
        </header>
        <div id="content"></div>
      </article>

      <!-- Новый контейнер для отображения JSON дерева (по умолчанию скрыт) -->
      <pre class="json-paper hidden" id="jsonTree"></pre>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
